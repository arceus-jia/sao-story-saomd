<script>
'use strict';
const V=window.SAOMD_VOICES||{lines:{},clips:{}},D=window.SAOMD_CATALOG,$=id=>document.getElementById(id),storyMap=new Map(D.stories.map(s=>[s.id,s])),assets=new Map(D.assets.map(a=>[a.id,a]));
let language='zh',selected=D.stories[0].id,mode='read',listPage=0,imagePage=0,lastFocus=null;
const t=(item,key)=>language==='zh'?item[key+'_zh']:item[key];
const pending=new Map(),el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
D.stories.forEach(s=>s.search=[s.id,s.title,s.title_zh,s.group,s.group_zh,...s.speakers,...s.speakers_zh].join(' ').toLowerCase());D.assets.forEach(a=>a.search=[a.id,a.name,a.name_zh,a.category,...a.uses.map(u=>u.story)].join(' ').toLowerCase());
const voicePlayer=$('voice-player');let voiceButton=null,voiceRequest=0;
function stopVoice(){voiceRequest++;voicePlayer.pause();voicePlayer.removeAttribute('src');voicePlayer.load();if(voiceButton){voiceButton.textContent=voiceButton.dataset.label;voiceButton.setAttribute('aria-pressed','false');}voiceButton=null;}
function voiceFailed(){if(!voiceButton||!voicePlayer.error)return;const button=voiceButton;stopVoice();button.textContent=language==='zh'?'播放失败，点击重试':'Retry voice';}
async function playVoice(button,src){if(voiceButton===button){stopVoice();return;}stopVoice();const request=voiceRequest;voiceButton=button;button.textContent=language==='zh'?'加载中…':'Loading…';button.setAttribute('aria-pressed','true');voicePlayer.src=src;try{await voicePlayer.play();if(request===voiceRequest)button.textContent=language==='zh'?'停止播放':'Stop voice';}catch(error){if(request===voiceRequest){stopVoice();button.textContent=language==='zh'?'播放失败，点击重试':'Retry voice';}}}
voicePlayer.addEventListener('ended',stopVoice);voicePlayer.addEventListener('error',voiceFailed);window.addEventListener('pagehide',stopVoice);
function loadStory(id){if(window.SAOMD_STORIES[id])return Promise.resolve(window.SAOMD_STORIES[id]);if(pending.has(id))return pending.get(id);const promise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='assets/stories/'+id+'.js';script.onload=()=>{script.remove();pending.delete(id);const data=window.SAOMD_STORIES[id];if(data)resolve(data);else reject(new Error('Missing story data'));};script.onerror=()=>{script.remove();pending.delete(id);reject(new Error('Local file unavailable'));};document.head.append(script);});pending.set(id,promise);return promise;}
function filteredStories(){const q=$('story-search').value.trim().toLowerCase(),cat=$('story-category').value,group=$('story-group').value;return D.stories.filter(s=>(!q||s.search.includes(q))&&(!cat||s.category===cat)&&(!group||s.group_id===group));}
function groups(){const selectedGroup=$('story-group').value,category=$('story-category').value,available=new Map();D.stories.filter(s=>!category||s.category===category).forEach(s=>available.set(s.group_id,t(s,'group')));$('story-group').replaceChildren(new Option('全部章节 / 系列',''));available.forEach((label,id)=>$('story-group').append(new Option(label,id)));if(available.has(selectedGroup))$('story-group').value=selectedGroup;}
function renderList(){const list=filteredStories(),pages=Math.max(1,Math.ceil(list.length/60));listPage=Math.min(listPage,pages-1);$('story-count').textContent=list.length+' / '+D.stories.length+' 组剧情';$('story-list').replaceChildren(...list.slice(listPage*60,(listPage+1)*60).map(s=>{const b=el('button','story-link'+(s.id===selected?' selected':''));b.type='button';b.dataset.story=s.id;b.append(el('small','',s.category+' / '+t(s,'group')),el('span','',t(s,'title')+' · #'+s.id));b.onclick=()=>goStory(s.id);return b;}));if(!list.length)$('story-list').append(el('p','empty','没有找到匹配的标题、人物或编号。'));$('list-page').textContent=(listPage+1)+' / '+pages;$('list-previous').disabled=listPage===0;$('list-next').disabled=listPage>=pages-1;}
function goStory(id,frame){const p=new URLSearchParams({story:id});if(frame!==undefined)p.set('frame',frame);const hash='#'+p.toString();if(location.hash===hash){readHash();return;}location.hash=hash;}
function imageCard(id,links=false){const a=assets.get(id),figure=el('figure','image-card'),button=el('button'),img=el('img');button.type='button';button.setAttribute('aria-label','查看 '+t(a,'name'));img.src=a.thumbnail;img.alt=t(a,'name');img.loading='lazy';img.width=a.width;img.height=a.height;button.append(img);button.onclick=()=>openImage(id);figure.append(button);const caption=el('figcaption');caption.append(el('small','',a.category),el('span','',t(a,'name')));if(links){const uses=[...new Map(a.uses.map(u=>[u.story,u])).values()];if(uses.length){caption.append(el('div','muted','关联 '+uses.length+' 篇剧情'));uses.slice(0,2).forEach(u=>{const link=el('a','', '#'+u.story);link.href='#story='+u.story+'&frame='+u.frame;caption.append(link);});}else caption.append(el('div','muted','暂无对应文案引用'));}figure.append(caption);return figure;}
function openImage(id){const a=assets.get(id);if(!a)return;lastFocus=document.activeElement;$('image-title').textContent=t(a,'name')+' · '+a.category;const image=$('image-full');image.src=a.image;image.alt=t(a,'name');image.width=a.width;image.height=a.height;$('image-original').href=a.image;$('image-original').textContent=a.kind==='portrait'?'打开合成立绘':'打开原图';$('image-stage').classList.remove('dark');$('image-background').textContent='深色底';$('image-info').replaceChildren(el('p','',a.caption+' · '+a.width+' × '+a.height));const uses=[...new Map(a.uses.map(u=>[u.story,u])).values()];uses.forEach(u=>{const s=storyMap.get(u.story),link=el('a','',t(s,'title')+' · #'+s.id);link.href='#story='+s.id+'&frame='+u.frame;link.onclick=()=>$('image-dialog').close();$('image-info').append(link);});if(!uses.length)$('image-info').append(el('p','muted','包内原图，尚未找到本剧情表中的直接文案引用。'));$('image-dialog').showModal();}
function renderStory(data){stopVoice();const meta=storyMap.get(data.id),reader=$('reader');reader.replaceChildren();reader.dataset.storyId=String(data.id);reader.append(el('div','kicker',meta.category+' / '+t(meta,'group')),el('h2','',t(meta,'title')));const info=el('p','muted', '#'+meta.id+' · '+meta.text_count+' 条正文 · '+data.frames.length+' 个原始步骤　');const md=el('a','','本篇所在 Markdown');md.href=language==='zh'?meta.md_zh:meta.md;md.target='_blank';md.rel='noopener';info.append(md);reader.append(info);if(meta.summary)reader.append(el('p','summary',t(meta,'summary')));reader.append(el('p','notice',(language==='zh'?D.translation.note:'正文为包内英文原文。')+' 插图按脚本引用穿插，角色图由原图层合成；移动、镜头与过渡动画未重建。'));
if(V.stats?.lines)reader.append(el('p','voice-notice',language==='zh'?'有按钮的台词可播放原游戏语音；部分仅为语气音或短句，并非整句朗读。':'Voice buttons play the original game clips, which may be short phrases or reactions.'));
const backgroundIds=meta.images.filter(id=>assets.get(id)?.kind==='background');if(backgroundIds.length){const backgrounds=el('details');backgrounds.append(el('summary','', '本篇引用的 '+backgroundIds.length+' 张背景'));const grid=el('div','image-grid backgrounds');backgroundIds.forEach(id=>grid.append(imageCard(id)));backgrounds.append(grid);reader.append(backgrounds);}
let lastArt='';for(const frame of data.frames){const block=el('section','frame');block.id='step-'+frame.order;block.dataset.order=frame.order;const artIds=[...new Set(frame.actions.flatMap(a=>[a.illustration?'still:'+a.illustration:'',a.item?'item:'+a.item:'']).filter(id=>assets.has(id)))];const current=artIds.join('|');if(current&&current!==lastArt){block.append(el('p','image-reference','第 '+frame.order+' 步引用的插图 / 道具'));for(const id of artIds){const a=assets.get(id),figure=el('figure','inline-art'),button=el('button'),img=el('img');figure.dataset.imageId=id;button.type='button';button.setAttribute('aria-label','查看 '+t(a,'name'));img.src=a.image;img.alt=t(a,'name');img.loading='lazy';img.width=a.width;img.height=a.height;button.append(img);button.onclick=()=>openImage(id);figure.append(button,el('figcaption','',a.category+' · '+t(a,'name')));block.append(figure);}}lastArt=current;
for(const action of frame.actions){if(!action.text)continue;const portrait=assets.get('portrait:'+action.pose),line=el('div','line'+(portrait?'':' no-portrait')+(action.speaker?'':' narration'));line.dataset.uid=action.uid;if(portrait){const button=el('button','portrait'),img=el('img');button.setAttribute('aria-label','查看 '+t(action,'speaker')+' 的角色立绘');img.src=portrait.thumbnail;img.alt='';img.loading='lazy';button.append(img);button.onclick=()=>openImage(portrait.id);line.append(button);}const body=el('div'),heading=el('div','line-heading');heading.append(el('div','speaker',t(action,'speaker')||(language==='zh'?'旁白':'Narration')));const voice=V.clips[V.lines[action.uid]];if(voice){const button=el('button','voice-button',language==='zh'?'播放原声':'Play voice');button.type='button';button.dataset.uid=action.uid;button.dataset.label=button.textContent;button.setAttribute('aria-pressed','false');button.title=language==='zh'?'原游戏短语音，可能不是整句朗读':'Original game voice; may be a short phrase or reaction';button.onclick=()=>playVoice(button,voice.src);heading.append(button);}body.append(heading,el('p','text',t(action,'text')));line.append(body);block.append(line);}reader.append(block);}
if(data.branches.length){const detail=el('details');detail.append(el('summary','','原配置中的选择文本'));for(const section of data.branches)for(const choice of section.choices)detail.append(el('p','muted','段落 '+section.id+' · '+t(choice,'text')+' → 段落 '+choice.target));reader.append(detail);}
const list=filteredStories(),i=list.findIndex(s=>s.id===meta.id),nav=el('nav','scene-nav');[['上一篇',i-1],['下一篇',i+1]].forEach(([label,index])=>{const b=el('button','',label);b.disabled=i<0||index<0||index>=list.length;b.onclick=()=>goStory(list[index].id);nav.append(b);});reader.append(nav);}
function filteredImages(){const q=$('image-search').value.trim().toLowerCase(),kind=$('image-kind').value;return D.assets.filter(a=>(!kind||a.kind===kind)&&(!q||a.search.includes(q)));}
function renderGallery(){const list=filteredImages(),pages=Math.max(1,Math.ceil(list.length/24));imagePage=Math.min(imagePage,pages-1);$('image-count').textContent=list.length+' / '+D.assets.length+' 个图片资源';$('gallery-grid').replaceChildren(...list.slice(imagePage*24,(imagePage+1)*24).map(a=>imageCard(a.id,true)));if(!list.length)$('gallery-grid').append(el('p','empty','没有找到匹配的图片。'));$('image-page').textContent=(imagePage+1)+' / '+pages;$('image-previous').disabled=imagePage===0;$('image-next').disabled=imagePage>=pages-1;}
async function readHash(){stopVoice();if($('image-dialog').open)$('image-dialog').close();const params=new URLSearchParams(location.hash.slice(1));mode=location.hash.startsWith('#gallery')?'gallery':'read';$('reading').hidden=mode!=='read';$('gallery').hidden=mode!=='gallery';$('read-tab').classList.toggle('active',mode==='read');$('gallery-tab').classList.toggle('active',mode==='gallery');if(mode==='gallery'){renderGallery();return;}if(params.has('category')){$('story-category').value=params.get('category');$('story-group').value='';groups();const first=filteredStories()[0];if(first)selected=first.id;}else if(storyMap.has(Number(params.get('story'))))selected=Number(params.get('story'));const s=storyMap.get(selected);if($('story-category').value&&$('story-category').value!==s.category)$('story-category').value=s.category;groups();if($('story-group').value&&$('story-group').value!==s.group_id)$('story-group').value='';if($('story-search').value&&!s.search.includes($('story-search').value.trim().toLowerCase()))$('story-search').value='';renderList();const requestId=selected;$('reader').replaceChildren(el('p','muted','正在读取本篇剧情…'));try{const data=await loadStory(requestId);if(selected!==requestId||mode!=='read')return;renderStory(data);if(params.has('frame'))requestAnimationFrame(()=>$('step-'+params.get('frame'))?.scrollIntoView({block:'start'}));else window.scrollTo(0,0);}catch(error){if(selected===requestId)$('reader').replaceChildren(el('p','empty','未能读取这篇的本地资源，请确认已解压完整文件夹，并保留 assets 目录。'));}}
$('language').onchange=()=>{language=$('language').value;$('language-note').textContent=language==='zh'?'中文译稿 · 支持英文对照':'英文原文 · 离线阅读';groups();renderList();if(mode==='gallery')renderGallery();else if(window.SAOMD_STORIES[selected]){const position=window.scrollY;renderStory(window.SAOMD_STORIES[selected]);window.scrollTo(0,position);}};
$('story-category').value='主线剧情';groups();$('read-tab').onclick=()=>goStory(selected);$('gallery-tab').onclick=()=>{location.hash='gallery';};$('story-search').oninput=()=>{listPage=0;renderList();};$('story-category').onchange=()=>{listPage=0;$('story-group').value='';groups();renderList();};$('story-group').onchange=()=>{listPage=0;renderList();};$('list-previous').onclick=()=>{listPage--;renderList();};$('list-next').onclick=()=>{listPage++;renderList();};$('image-search').oninput=()=>{imagePage=0;renderGallery();};$('image-kind').onchange=()=>{imagePage=0;renderGallery();};$('image-previous').onclick=()=>{imagePage--;renderGallery();};$('image-next').onclick=()=>{imagePage++;renderGallery();};$('image-close').onclick=()=>$('image-dialog').close();$('image-background').onclick=()=>{const dark=$('image-stage').classList.toggle('dark');$('image-background').textContent=dark?'浅色底':'深色底';};$('image-dialog').addEventListener('close',()=>lastFocus?.focus());$('image-dialog').addEventListener('click',e=>{if(e.target===$('image-dialog'))$('image-dialog').close();});window.addEventListener('hashchange',readHash);readHash();
</script></body></html>
